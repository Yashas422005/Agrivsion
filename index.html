<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌱 Farmer Assistant</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f8f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: green;
    }

    #chat-box {
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
      overflow-y: auto;
      padding: 10px;
      background: white;
    }

    .msg {
      margin: 10px 0;
    }

    .user {
      text-align: right;
      color: blue;
    }

    .bot {
      text-align: left;
      color: green;
    }

    input {
      width: 300px;
      padding: 8px;
    }

    button {
      padding: 8px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>🌱 Farmer Assistant</h1>

  <div id="chat-box"></div>

  <input id="message" placeholder="Ask something..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chatBox = document.getElementById("chat-box");

      let message = input.value;
      if (!message) return;

      // Show user message
      chatBox.innerHTML += `<div class="msg user"><b>You:</b> ${message}</div>`;
      input.value = "";

      try {
        let response = await fetch("http://127.0.0.1:5000/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_id: "farmer1",
            message: message
          })
        });

        if (!response.ok) {
          throw new Error("Server error");
        }

        let data = await response.json();

        chatBox.innerHTML += `<div class="msg bot"><b>Bot:</b> ${data.response}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
        console.error(error);
        chatBox.innerHTML += `<div class="msg bot">⚠️ Server not reachable</div>`;
      }
    }
  </script>

</body>
</html>
